version: '3.8'

# 生产环境 Docker Compose 配置
# 使用预构建的镜像，通过 GitHub Container Registry 拉取

services:
  embed-service:
    image: ghcr.io/azincc/gdstudio-embeded-service:latest
    container_name: embed-service
    ports:
      - "5434:8080"
    environment:
      - DATABASE_URL=file:/work/data/embed.db?_journal_mode=WAL&_busy_timeout=5000
      - GD_API_BASE=https://music-api.gdstudio.xyz
      - NAVIDROME_BASE_URL=${NAVIDROME_BASE_URL}
      - NAVIDROME_USER=${NAVIDROME_USER}
      - NAVIDROME_PASSWORD=${NAVIDROME_PASSWORD}
      - API_KEY=${API_KEY:-dev-api-key-please-change-in-production}
      - API_KEY_NAME=${API_KEY_NAME:-echo-client}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-3}
      - JOB_POLL_INTERVAL=${JOB_POLL_INTERVAL:-2s}
      - DOWNLOAD_TIMEOUT=${DOWNLOAD_TIMEOUT:-600s}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MUSICBRAINZ_ENABLED=${MUSICBRAINZ_ENABLED:-true}
      - MUSICBRAINZ_BASE_URL=${MUSICBRAINZ_BASE_URL:-https://musicbrainz.org/ws/2}
      - COVERARTARCHIVE_BASE_URL=${COVERARTARCHIVE_BASE_URL:-https://coverartarchive.org}
      - ACOUSTID_BASE_URL=${ACOUSTID_BASE_URL:-https://api.acoustid.org/v2}
      - ACOUSTID_CLIENT=${ACOUSTID_CLIENT:-}
      - TZ=Asia/Shanghai
    volumes:
      - ${NAVIDROME_MUSIC_DIR}:/music:rw
      - ${WORK_ROOT}/work:/work:rw
    restart: unless-stopped
